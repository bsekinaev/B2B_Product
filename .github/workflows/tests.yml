name: Тестирование B2B-генератора

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -e '.[dev]'
      - name: Проверить тесты и покрытие
        run: python -m pytest -q --cov=app --cov-branch --cov-fail-under=95
      - name: Проверить линтер
        run: python -m ruff check .
      - name: Проверить форматирование
        run: python -m ruff format --check .
      - name: Проверить зависимости
        run: python -m pip check
      - name: Офлайн-приёмка
        run: python -m scripts.run_acceptance
