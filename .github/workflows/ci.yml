name: Проверки B2B-генератора

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: b2b-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7.0.1

      - name: Подготовить Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"

      - name: Проверить зависимости
        run: python -m pip check

      - name: Проверить Ruff
        run: python -m ruff check .

      - name: Проверить форматирование
        run: python -m ruff format --check .

      - name: Проверить тесты с покрытием ветвлений
        run: python -m pytest -q --cov=app --cov-branch --cov-fail-under=95

      - name: Проверить HTTP-контракт офлайн
        run: python -m scripts.run_acceptance

      - name: Проверить 24 синтетических сценария
        run: python -m scripts.run_synthetic_batch --output artifacts/ci_batch_24
